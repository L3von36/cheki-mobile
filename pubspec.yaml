name: mahtem
description: >-
  Mahtem (ማህተም — "stamp/seal") for Android — free Ethiopian bank receipt
  verification. Verify CBE, Telebirr, BOA, M-Pesa, Dashen, Awash, Wegagen,
  Amhara, Zemen, CBE Birr, Siinqee and eBirr payment receipts in seconds.
  First 5 checks free, then activate Mahtem Pro.
publish_to: "none"
version: 1.13.1+37

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.0
  camera: ^0.12.0
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  google_mlkit_text_recognition: ^0.16.0
  http: ^1.4.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  mobile_scanner: ^7.0.1
  package_info_plus: ^8.0.0
  permission_handler: ^11.3.1
  pointycastle: ^3.9.1
  provider: ^6.1.2
  sentry_flutter: ^9.0.0
  share_plus: ^11.0.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  flutter_secure_storage: ^10.3.4
  cryptography: ^2.9.0
  android_id: ^0.5.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  pdf: ^3.11.0

flutter:
  uses-material-design: true

  # Brand seal (verified-stamp artwork) used by the gate splash, auth
  # header and home app bar — bundled so branding never depends on the
  # network.
  assets:
    - assets/icon/brand_seal.png

  # Noto Sans Ethiopic ships WITH the app — Amharic mode must never depend
  # on a runtime google_fonts download (offline devices got fallback tofu).
  fonts:
    - family: Noto Sans Ethiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansEthiopic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansEthiopic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansEthiopic-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSansEthiopic-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  image_path: "assets/icon/mahtem_icon.png"
  android: true
  ios: false
  min_sdk_android: 24
  adaptive_icon_background: "assets/icon/adaptive_bg.png"
  adaptive_icon_foreground: "assets/icon/adaptive_fg.png"
  adaptive_icon_monochrome: "assets/icon/adaptive_mono.png"
