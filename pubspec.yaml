name: mahtem
description: >-
  Mahtem (ማህተም — "stamp/seal") for Android — free Ethiopian bank receipt
  verification. Verify CBE, Telebirr, BOA, M-Pesa, Dashen, Awash, Zemen,
  CBE Birr, Siinqee and eBirr payment receipts in seconds. No signup,
  no API key, no fees.
publish_to: "none"
version: 1.4.6+11

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.0
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.4.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  mobile_scanner: ^7.0.1
  permission_handler: ^11.3.1
  pointycastle: ^3.9.1
  provider: ^6.1.2
  share_plus: ^11.0.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  pdf: ^3.11.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/mahtem_icon.png"
  android: true
  ios: false
  min_sdk_android: 24
  adaptive_icon_background: "assets/icon/adaptive_bg.png"
  adaptive_icon_foreground: "assets/icon/adaptive_fg.png"
  adaptive_icon_monochrome: "assets/icon/adaptive_mono.png"
