name: Release APK

# Builds the signed release APK and attaches it to a GitHub Release.
# Trigger: push a tag like v1.0.0  (or run manually from the Actions tab)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable, pinned)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.3
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      # ── Signing ─────────────────────────────────────────────────────
      # Secrets expected (set in repo → Settings → Secrets → Actions):
      #   KEYSTORE_BASE64     base64 of the release keystore (.jks)
      #   KEYSTORE_PASSWORD   keystore password
      #   KEY_ALIAS           key alias
      #   KEY_PASSWORD        key password
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
            cat > android/key.properties <<EOF
          storeFile=keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Keystore restored — release will be signed."
          else
            echo "No KEYSTORE_BASE64 secret found — building debug-signed release APK."
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK with tag
        id: rename
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          DEST="cheki-mobile-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$DEST"
          echo "apk=$DEST" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -la "$DEST"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          name: Cheki Mobile ${{ github.ref_name }}
          body: |
            ## Cheki Mobile ${{ github.ref_name }}

            Free Ethiopian bank receipt verification — CBE, Telebirr, BOA, M-Pesa,
            Dashen, Awash, Zemen, CBE Birr, Siinqee and eBirr.

            ### Install
            1. Download `cheki-mobile-${{ github.ref_name }}.apk` below
            2. Allow "Install from unknown sources" if prompted
            3. Install and verify your first receipt

            Free forever · No signup · Data comes from official bank endpoints.
          files: |
            ${{ steps.rename.outputs.apk }}
          generate_release_notes: true
          draft: false
          prerelease: false
