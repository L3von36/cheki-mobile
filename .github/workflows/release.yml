name: Release APK

# Builds the signed release APK and attaches it to a GitHub Release.
# Trigger: push a tag like v1.0.0  (or run manually from the Actions tab)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable, pinned)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.3
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      # ── Signing ─────────────────────────────────────────────────────
      # Secrets expected (set in repo → Settings → Secrets → Actions):
      #   KEYSTORE_BASE64     base64 of the release keystore (.jks)
      #   KEYSTORE_PASSWORD   keystore password
      #   KEY_ALIAS           key alias
      #   KEY_PASSWORD        key password
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
            cat > android/key.properties <<EOF
          storeFile=keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Keystore restored — release will be signed."
          else
            echo "No KEYSTORE_BASE64 secret found — building debug-signed release APK."
          fi

      - name: Build release APKs (split per ABI + universal)
        run: |
          flutter build apk --release --split-per-abi \
            --obfuscate \
            --split-debug-info=build/symbols
          # Modern Flutter no longer emits the fat APK from --split-per-abi,
          # so build the universal one as a second pass (gradle cache makes
          # this incremental).
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/symbols

      - name: Rename APKs with tag
        id: rename
        env:
          TAG: ${{ github.ref_name }}
        run: |
          OUT=build/app/outputs/flutter-apk
          cp "$OUT/app-arm64-v8a-release.apk"   "mahtem-${TAG}-arm64.apk"
          cp "$OUT/app-armeabi-v7a-release.apk" "mahtem-${TAG}-arm32.apk"
          cp "$OUT/app-release.apk"             "mahtem-${TAG}-universal.apk"
          ls -la mahtem-*.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          name: Mahtem ${{ github.ref_name }}
          body: |
            ## Mahtem ${{ github.ref_name }}

            **Mahtem** (ማህተም — Amharic for *"stamp / seal"*) — free Ethiopian
            bank receipt verification. CBE, Telebirr, BOA, M-Pesa, Dashen,
            Awash, Zemen, CBE Birr, Siinqee and eBirr.

            ### Install
            1. Download **`mahtem-${{ github.ref_name }}-arm64.apk`** — fits almost
               every phone sold since 2016, and it is ~2.5x smaller than before
            2. Very old phone? Download `mahtem-${{ github.ref_name }}-arm32.apk`
            3. Not sure which? `mahtem-${{ github.ref_name }}-universal.apk`
               works on everything (larger download)
            4. Allow "Install from unknown sources" if prompted
            5. Install and stamp your first receipt as verified

            Free forever · No signup · Data comes from official bank endpoints.
          files: |
            mahtem-${{ github.ref_name }}-arm64.apk
            mahtem-${{ github.ref_name }}-arm32.apk
            mahtem-${{ github.ref_name }}-universal.apk
          generate_release_notes: true
          draft: false
          prerelease: false
